# Starts the PostgreSQL database in Docker.
#   Start:  docker compose up -d
#   Stop:   docker compose down        (data is kept)
#   Status: docker compose ps
# Later steps add backend, frontend and nginx services here.

services:
  db:
    image: postgres:16-alpine
    container_name: gametracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:5432:5432"   # only reachable from this computer, not the network
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
