# =====================================================
#  GAME TRACKER - SETTINGS
#  You can change these values without touching code.
#  Lines starting with # are notes, the app ignores them.
# =====================================================

app:
  name: "Game Tracker"
  timezone: "Asia/Kolkata"     # all times below use this time zone (IST)

schedule:
  daily_run_time: "00:00"      # 24-hour format. "00:00" = 12 AM midnight (used from Step 4)

defaults:
  country: "in"                # 2-letter country code: in = India, us = USA
  top_n: 50                    # how many games to save per chart (max 200)

platforms:
  appstore:
    enabled: true              # true = fetch this platform, false = skip it
    charts:                    # which App Store charts to fetch (remove a line to skip it)
      - top_free
      - top_paid
      - top_grossing

  playstore:
    enabled: true              # unofficial: copies what the Play Store website does. May break if Google changes it.
    charts:
      - top_free
      - top_paid
      - top_grossing

  roblox:
    enabled: true
    charts: all                # "all" = every list on roblox.com/charts
                               # or pick some, e.g.:  charts: [top_trending, top_playing_now, top_earning]
    devices:                   # Roblox charts are different per device
      - high_end_phone         # phones (most players in India)
      - computer
      # other options: low_end_phone, high_end_tablet, low_end_tablet, console, vr

http:
  timeout_seconds: 20          # wait this long for a platform to answer
  max_retries: 3               # try again this many times if a request fails
